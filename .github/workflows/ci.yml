name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (format)
        run: uv run ruff format --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Lint imports
        run: uv run lint-imports

      - name: Test
        run: uv run pytest

      - name: Regenerate OpenAPI contract
        run: uv run python scripts/export_openapi.py

      - name: Ensure OpenAPI contract is up to date
        run: git diff --exit-code openapi.json
